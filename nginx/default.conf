# Reference Nginx reverse-proxy configuration for a host-installed Nginx.
# For the Docker Compose demo, the active configuration is frontend/nginx.conf.
# If Nginx runs directly on the host, proxy_pass would need a host-reachable
# backend address/port; the Compose service name "backend" resolves only
# inside the Compose network.

server {
    listen 80;
    server_name demo.local;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

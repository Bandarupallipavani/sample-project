services:
  backend:
    build:
      context: ./backend
    container_name: demo-backend
    environment:
      PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: demo-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
